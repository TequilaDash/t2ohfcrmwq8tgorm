name: verify

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify artifacts
        run: python verify_artifacts.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build-report.md
